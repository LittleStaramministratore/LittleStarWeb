<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angelica</title>

<style>
body {
    margin: 0;
    background: #f3f3f8;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* contenitore principale */
#chat-container {
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* barra top */
#top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: #ffffff;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 10;
}

#top-bar h1 {
    font-size: 1.15rem;
    margin: 0;
}

/* avatar */
#avatar-wrapper {
    position: fixed;
    top: 10px;
    right: 10px;
    text-align: center;
    z-index: 20;
}

#avatar-img {
    width: 85px;
    height: 85px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 10px rgba(0,0,0,0.15);
}

/* animazione quando parla */
#avatar-img.talking {
    animation: talking 0.35s infinite alternate;
    box-shadow: 0 0 18px rgba(255, 193, 7, 0.7);
}

@keyframes talking {
    from { transform: scale(1.0); }
    to { transform: scale(1.05); }
}

/* area chat */
#chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    margin-bottom: 90px; /* spazio per la barra sotto */
}

/* messaggi */
.msg {
    padding: 11px 13px;
    border-radius: 12px;
    margin-bottom: 12px;
    max-width: 75%;
    font-size: 1rem;
    line-height: 1.4;
    word-wrap: break-word;
}

.user {
    background: #cfe3ff;
    margin-left: auto;
}

.bot {
    background: #ffe7c7;
    margin-right: auto;
}

/* input area */
#input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #ffffff;
    padding: 10px 12px;
    display: flex;
    gap: 8px;
    border-top: 1px solid #cccccc;
    z-index: 15;
}

#msg {
    flex: 1;
    padding: 10px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid #ccc;
}

#send-btn {
    padding: 0 16px;
    font-size: 1.2rem;
    border: none;
    background: black;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

/* selettore voce */
#voice-select {
    font-size: 0.9rem;
    padding: 4px 6px;
    border-radius: 6px;
}
</style>

</head>
<body>

<div id="avatar-wrapper">
    <img id="avatar-img" src="{{ url_for('static', filename='angelica_avatar.png') }}" alt="Angelica">
</div>

<div id="chat-container">

    <div id="top-bar">
        <h1>Angelica</h1>
        <div>
            <label for="voice-select" style="font-size:0.9rem;">Voce:</label>
            <select id="voice-select">
                <option value="solstice">Solstice (dolce)</option>
                <option value="aria">Aria (calda)</option>
            </select>
        </div>
    </div>

    <div id="chat"></div>

</div>

<!-- barra input -->
<div id="input-area">
    <input id="msg" type="text" placeholder="Scrivi qui..." autocomplete="off"
           onkeydown="if(event.key==='Enter') send();" />
    <button id="send-btn" onclick="send()">➤</button>
</div>

<!-- audio player -->
<audio id="voice-player"></audio>

<script>
function appendMessage(text, cls){
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.innerText = text;
    document.getElementById("chat").appendChild(div);

    const chat = document.getElementById("chat");
    chat.scrollTop = chat.scrollHeight;
}

function setAvatarTalking(isTalking){
    const img = document.getElementById("avatar-img");
    isTalking ? img.classList.add("talking") : img.classList.remove("talking");
}

function playVoice(url){
    if(!url) return;  // audio opzionale
    const audio = document.getElementById("voice-player");
    setAvatarTalking(true);
    audio.src = url + "?t=" + Date.now();
    audio.play().catch(() => setAvatarTalking(false));
    audio.onended = () => setAvatarTalking(false);
}

async function send(){
    const campo = document.getElementById("msg");
    const text = campo.value.trim();
    if(!text) return;

    appendMessage(text, "user");
    campo.value = "";

    const voiceChoice = document.getElementById("voice-select").value;

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                message: text,
                voice: voiceChoice
            })
        });

        const data = await response.json();
        const botText = data.response || "Nessuna risposta";
        const audioUrl = data.audio_url;

        appendMessage(botText, "bot");
        playVoice(audioUrl);

    } catch (e) {
        appendMessage("Errore di connessione", "bot");
    }
}
</script>

</body>
</html>
