<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Little Star International School</title>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-512.png') }}">
  <meta name="theme-color" content="#ff5f6d">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      margin: 0;
      padding: 0;
      text-align: center;
      overflow-x: hidden;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      animation: cambioSfondo 16s infinite alternate ease-in-out;
    }

    @keyframes cambioSfondo {
      0% { background-image: url("{{ url_for('static', filename='school_01.jpg') }}"); }
      100% { background-image: url("{{ url_for('static', filename='school_02.jpg') }}"); }
    }

    header {
      background: rgba(0,0,0,0.5);
      padding: 20px;
      font-size: 2em;
      font-weight: bold;
    }

    section {
      margin: 30px auto;
      padding: 25px;
      border-radius: 15px;
      background: rgba(0,0,0,0.55);
      max-width: 850px;
      backdrop-filter: blur(5px);
    }

    #angelica {
      position: fixed;
      bottom: 55px;
      right: 30px;
      display: flex;
      align-items: flex-end;
      gap: 15px;
      z-index: 9999;
    }

    #angelica-bubble {
      background: rgba(255,255,255,0.15);
      padding: 12px 16px;
      border-radius: 16px;
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 1em;
      max-width: 260px;
      display: none;
    }

    #angelica-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(255,95,109,0.9);
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #angelica-avatar:hover {
      transform: scale(1.08);
    }

    /* CHAT */
    #chat-container {
      position: fixed;
      bottom: 140px;
      right: 30px;
      width: 300px;
      background: rgba(0,0,0,0.55);
      padding: 15px;
      border-radius: 12px;
      display: none;
      backdrop-filter: blur(6px);
      z-index: 9999;
    }

    #user-input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
    }

    #send-btn {
      margin-top: 10px;
      padding: 8px;
      width: 100%;
      border-radius: 8px;
      border: none;
      background: #ff5f6d;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>🌟 Little Star International School</header>

<section>
  <h2>Benvenuto!</h2>
  <p>Tocca Angelica per iniziare ✨</p>
</section>

<section>
  <h2>Chi siamo</h2>
  <p>Little Star è un asilo nido e scuola materna internazionale 0–6 anni…</p>
</section>

<!-- ANGELICA -->
<div id="angelica">
  <div id="angelica-bubble">Ciao! Come posso aiutarti? 💫</div>
  <img id="angelica-avatar" src="{{ url_for('static', filename='angelica_avatar.png') }}" alt="Angelica">
</div>

<!-- CHAT BOX -->
<div id="chat-container">
  <input id="user-input" type="text" placeholder="Scrivi qui...">
  <button id="send-btn">Invia</button>
</div>

<script>
  const avatar = document.getElementById("angelica-avatar");
  const bubble = document.getElementById("angelica-bubble");
  const chat = document.getElementById("chat-container");
  const input = document.getElementById("user-input");

  avatar.onclick = () => {
    bubble.style.display = "block";
    chat.style.display = "block";
  };

  document.getElementById("send-btn").onclick = sendMessage;

  input.addEventListener("keypress", e => {
    if (e.key === "Enter") sendMessage();
  });

  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    bubble.innerText = "Sto pensando... ✨";

    fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    })
    .then(res => res.json())
    .then(data => {
      bubble.innerText = data.reply;
      input.value = "";
    })
    .catch(() => {
      bubble.innerText = "Errore di connessione.";
    });
  }
</script>

<script src="/service-worker.js"></script>

</body>
</html>
